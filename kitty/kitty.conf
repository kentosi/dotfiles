# Mirrors ghostty/config: Hack Nerd Font, Gruvbox Dark, translucent blurred
# background, titlebar-integrated tabs, block cursor.

font_family      Hack Nerd Font Mono
font_size        14.0

# Window
background_opacity       0.9
background_blur          30
hide_window_decorations  titlebar-only
macos_option_as_alt      yes

# Cursor
cursor_shape          block
shell_integration     no-cursor

# Tabs
tab_bar_style           powerline
tab_powerline_style     round
tab_bar_edge            top
active_tab_foreground   #282828
active_tab_background   #d79921
inactive_tab_foreground #ebdbb2
inactive_tab_background #3c3836
tab_bar_background      #282828

# Theme: Gruvbox Dark
foreground            #ebdbb2
background            #282828
cursor                #ebdbb2
cursor_text_color     #282828
selection_foreground  #ebdbb2
selection_background  #665c54

color0  #282828
color1  #cc241d
color2  #98971a
color3  #d79921
color4  #458588
color5  #b16286
color6  #689d6a
color7  #a89984
color8  #928374
color9  #fb4934
color10 #b8bb26
color11 #fabd2f
color12 #83a598
